<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>물 정화 타이쿤</title>

    <!-- 예쁜 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #dff8ff,
                    #edf8fa 45%,
                    #dceff2
                );

            color: #17333b;

            font-family:
                "Poppins",
                "Noto Sans KR",
                sans-serif;
        }

        /* =========================
           상단
        ========================= */

        header {
            background: rgba(255,255,255,0.85);

            backdrop-filter: blur(15px);

            padding: 20px;

            text-align: center;

            border-bottom:
                1px solid rgba(0,0,0,0.05);

            position: sticky;
            top: 0;

            z-index: 10;
        }

        .title {
            font-size: 18px;
            font-weight: 700;

            color: #4a7881;
        }

        .money {
            margin-top: 4px;

            font-size: 32px;
            font-weight: 800;

            letter-spacing: -1px;

            color: #17333b;
        }


        /* =========================
           메인
        ========================= */

        .container {

            width: 100%;
            max-width: 1000px;

            margin: auto;

            padding: 30px 20px 60px;
        }


        /* =========================
           상태
        ========================= */

        .status {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 20px;
        }

        .status-box {

            background: rgba(255,255,255,0.8);

            padding: 10px 15px;

            border-radius: 14px;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.05);
        }


        /* =========================
           물
        ========================= */

        .water-area {

            text-align: center;

            margin-top: 10px;
        }

        .water {

            width: 300px;
            height: 300px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            cursor: pointer;

            font-size: 100px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #8a775a,
                    #4f422e
                );

            box-shadow:
                0 20px 40px rgba(0,0,0,0.18),
                inset 0 -15px 30px rgba(0,0,0,0.15);

            transition:
                transform 0.08s,
                filter 0.2s;
        }

        .water:hover {

            filter: brightness(1.05);

        }

        .water:active {

            transform: scale(0.91);

        }

        .water-name {

            margin-top: 20px;

            font-size: 25px;

            font-weight: 800;

        }

        .click-info {

            margin-top: 5px;

            color: #66848b;

            font-size: 15px;

            font-weight: 500;

        }


        /* =========================
           클릭 숫자
        ========================= */

        .click-effect {

            position: fixed;

            pointer-events: none;

            font-size: 22px;

            font-weight: 800;

            color: #149bb0;

            animation: floatUp 0.8s ease-out forwards;

            z-index: 100;
        }

        @keyframes floatUp {

            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.2);
            }

        }


        /* =========================
           상점
        ========================= */

        .shop {

            margin-top: 40px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .card {

            background:
                rgba(255,255,255,0.9);

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.07);

            border:
                1px solid rgba(0,0,0,0.04);
        }

        .card-icon {

            font-size: 32px;

            margin-bottom: 8px;
        }

        .card-title {

            font-size: 17px;

            font-weight: 800;

        }

        .card-description {

            margin-top: 5px;

            min-height: 45px;

            color: #6b858b;

            font-size: 13px;

            line-height: 1.5;

        }

        .upgrade-button {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 14px 10px;

            margin-top: 15px;

            background:
                linear-gradient(
                    135deg,
                    #25aabd,
                    #168ca0
                );

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.15s;

        }

        .upgrade-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.05);

        }

        .upgrade-button:active {

            transform: scale(0.97);

        }

        .upgrade-button:disabled {

            background: #b7c5c8;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           초기화
        ========================= */

        .reset {

            display: block;

            margin: 35px auto 0;

            padding: 10px 18px;

            border: none;

            background: transparent;

            color: #84999d;

            font-family: inherit;

            cursor: pointer;

            font-size: 12px;

        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 700px) {

            .container {

                padding:
                    20px 15px 50px;

            }

            .money {

                font-size: 28px;

            }

            .water {

                width: 240px;
                height: 240px;

                font-size: 80px;

            }

            .shop {

                grid-template-columns: 1fr;

            }

            .card-description {

                min-height: auto;

            }

        }

    </style>
</head>


<body>


<header>

    <div class="title">
        💧 물 정화 타이쿤
    </div>

    <div
        class="money"
        id="money"
    >
        ₩0
    </div>

</header>



<div class="container">


    <!-- 상태 -->

    <div class="status">

        <div class="status-box">
            🧪 정화 단계
            <span id="stage">
                1
            </span>
        </div>

        <div class="status-box">
            📈 배수
            <span id="multiplier">
                ×1
            </span>
        </div>

        <div class="status-box">
            🤖 자동
            <span id="autoLevel">
                Lv.0
            </span>
        </div>

    </div>



    <!-- 물 -->

    <div class="water-area">

        <div
            class="water"
            id="water"
            onclick="clickWater(event)"
        >
            🟤
        </div>

        <div
            class="water-name"
            id="waterName"
        >
            더러운 물
        </div>

        <div
            class="click-info"
            id="clickInfo"
        >
            클릭당 ₩1
        </div>

    </div>



    <!-- 상점 -->

    <div class="shop">


        <!-- 정화 -->

        <div class="card">

            <div class="card-icon">
                🧪
            </div>

            <div class="card-title">
                물 정화
            </div>

            <div
                class="card-description"
                id="purifyDescription"
            >
                다음 단계로 물을 정화합니다.
            </div>

            <button
                class="upgrade-button"
                id="purifyButton"
                onclick="purify()"
            >
                정화하기
            </button>

        </div>



        <!-- 자동 클릭 -->

        <div class="card">

            <div class="card-icon">
                🤖
            </div>

            <div class="card-title">
                자동 클릭
            </div>

            <div
                class="card-description"
                id="autoDescription"
            >
                1초마다 돈을 벌어줍니다.
            </div>

            <button
                class="upgrade-button"
                id="autoButton"
                onclick="upgradeAuto()"
            >
                구매
            </button>

        </div>



        <!-- 배수 -->

        <div class="card">

            <div class="card-icon">
                📈
            </div>

            <div class="card-title">
                수익 배수
            </div>

            <div
                class="card-description"
                id="multiplierDescription"
            >
                클릭 수익을 증가시킵니다.
            </div>

            <button
                class="upgrade-button"
                id="multiplierButton"
                onclick="upgradeMultiplier()"
            >
                구매
            </button>

        </div>


    </div>



    <button
        class="reset"
        onclick="resetGame()"
    >
        게임 초기화
    </button>


</div>



<script>


// ========================================
// 게임 데이터
// ========================================

let money =
    Number(
        localStorage.getItem("money")
    ) || 0;


let stage =
    Number(
        localStorage.getItem("stage")
    ) || 1;


let autoLevel =
    Number(
        localStorage.getItem("autoLevel")
    ) || 0;


let multiplierLevel =
    Number(
        localStorage.getItem("multiplierLevel")
    ) || 0;



// ========================================
// 정화 단계
// ========================================

const waterStages = [

    {
        name: "더러운 물",
        emoji: "🟤",
        color: "#654321",
        price: 200
    },

    {
        name: "탁한 물",
        emoji: "🟫",
        color: "#81745e",
        price: 500
    },

    {
        name: "정화된 물",
        emoji: "🟡",
        color: "#b8c58f",
        price: 2500
    },

    {
        name: "깨끗한 물",
        emoji: "🔵",
        color: "#4bbbd5",
        price: 10000
    },

    {
        name: "맑은 물",
        emoji: "💧",
        color: "#68d5ef",
        price: 50000
    },

    {
        name: "초순수",
        emoji: "💎",
        color: "#b9f5ff",
        price: 250000
    }

];



// ========================================
// 배수 가격
// ========================================

const multiplierPrices = [

    10,
    50,
    200,
    1000,
    5000,
    25000,
    100000

];


// ========================================
// 자동 클릭 가격
// ========================================

const autoPrices = [

    100,
    500,
    2000,
    10000,
    50000,
    250000

];



// ========================================
// 배수 계산
// ========================================

function getMultiplier() {

    return 1 +
        multiplierLevel * 0.5;

}



// ========================================
// 클릭 수익
// ========================================

function getClickPower() {

    return getMultiplier();

}



// ========================================
// 화면 업데이트
// ========================================

function updateScreen() {


    // 돈

    document.getElementById("money")
        .textContent =
        "₩" +
        Math.floor(money)
            .toLocaleString();



    // 단계

    document.getElementById("stage")
        .textContent =
        stage;



    // 배수

    document.getElementById("multiplier")
        .textContent =
        "×" +
        getMultiplier();



    // 자동 레벨

    document.getElementById("autoLevel")
        .textContent =
        "Lv." +
        autoLevel;



    // 물

    const current =
        waterStages[stage - 1];


    document.getElementById("water")
        .textContent =
        current.emoji;


    document.getElementById("water")
        .style.background =
        `radial-gradient(
            circle at 35% 30%,
            ${lighten(current.color)},
            ${current.color}
        )`;


    document.getElementById("waterName")
        .textContent =
        current.name;



    // 클릭 수익

    document.getElementById("clickInfo")
        .textContent =
        "클릭당 ₩" +
        getClickPower()
            .toLocaleString();



    updatePurify();

    updateAuto();

    updateMultiplier();

}



// ========================================
// 정화 업데이트
// ========================================

function updatePurify() {


    const button =
        document.getElementById(
            "purifyButton"
        );


    const description =
        document.getElementById(
            "purifyDescription"
        );


    if (stage >= waterStages.length) {

        description.textContent =
            "최고 단계에 도달했습니다!";

        button.textContent =
            "최종 단계 달성";

        button.disabled = true;

        return;
    }


    const next =
        waterStages[stage];


    description.textContent =
        "다음 단계: " +
        next.name +
        " · ₩" +
        next.price.toLocaleString();


    button.textContent =
        "🧪 정화 · ₩" +
        next.price.toLocaleString();


    button.disabled =
        money < next.price;

}



// ========================================
// 정화
// ========================================

function purify() {


    if (stage >= waterStages.length)
        return;


    const next =
        waterStages[stage];


    if (money < next.price)
        return;


    money -= next.price;

    stage++;


    saveGame();

    updateScreen();

}



// ========================================
// 자동 클릭 업데이트
// ========================================

function updateAuto() {


    const button =
        document.getElementById(
            "autoButton"
        );


    const description =
        document.getElementById(
            "autoDescription"
        );


    if (
        autoLevel >= autoPrices.length
    ) {

        description.textContent =
            "자동 클릭 최고 레벨!";

        button.textContent =
            "MAX";

        button.disabled = true;

        return;

    }


    const price =
        autoPrices[autoLevel];


    const income =
        autoLevel === 0
        ? 1
        : autoLevel * 5;


    description.textContent =
        "현재 Lv." +
        autoLevel +
        " · 다음 레벨은 초당 +" +
        income +
        "원";


    button.textContent =
        "🤖 Lv." +
        (autoLevel + 1) +
        " · ₩" +
        price.toLocaleString();


    button.disabled =
        money < price;

}



// ========================================
// 자동 클릭 업그레이드
// ========================================

function upgradeAuto() {


    if (
        autoLevel >= autoPrices.length
    )
        return;


    const price =
        autoPrices[autoLevel];


    if (money < price)
        return;


    money -= price;

    autoLevel++;


    saveGame();

    updateScreen();

}



// ========================================
// 배수 업데이트
// ========================================

function updateMultiplier() {


    const button =
        document.getElementById(
            "multiplierButton"
        );


    const description =
        document.getElementById(
            "multiplierDescription"
        );


    if (
        multiplierLevel >=
        multiplierPrices.length
    ) {

        description.textContent =
            "최대 배수에 도달했습니다!";

        button.textContent =
            "MAX";

        button.disabled = true;

        return;

    }


    const price =
        multiplierPrices[
            multiplierLevel
        ];


    const nextMultiplier =
        1 +
        (multiplierLevel + 1)
        * 0.5;


    description.textContent =
        "현재 ×" +
        getMultiplier() +
        " → 다음 ×" +
        nextMultiplier;


    button.textContent =
        "📈 ×" +
        nextMultiplier +
        " · ₩" +
        price.toLocaleString();


    button.disabled =
        money < price;

}



// ========================================
// 배수 업그레이드
// ========================================

function upgradeMultiplier() {


    if (
        multiplierLevel >=
        multiplierPrices.length
    )
        return;


    const price =
        multiplierPrices[
            multiplierLevel
        ];


    if (money < price)
        return;


    money -= price;

    multiplierLevel++;


    saveGame();

    updateScreen();

}



// ========================================
// 물 클릭
// ========================================

function clickWater(event) {


    const amount =
        getClickPower();


    money += amount;


    createClickEffect(
        event.clientX,
        event.clientY,
        amount
    );


    saveGame();

    updateScreen();

}



// ========================================
// 클릭 애니메이션
// ========================================

function createClickEffect(
    x,
    y,
    amount
) {


    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "click-effect";


    effect.textContent =
        "+₩" +
        amount.toLocaleString();


    effect.style.left =
        x + "px";


    effect.style.top =
        y + "px";


    document.body.appendChild(
        effect
    );


    setTimeout(() => {

        effect.remove();

    }, 800);

}



// ========================================
// 자동 수익
// ========================================

setInterval(() => {


    if (autoLevel <= 0)
        return;


    // 자동 클릭 수익

    const income =
        autoLevel *
        getMultiplier();


    money += income;


    saveGame();

    updateScreen();


}, 1000);



// ========================================
// 저장
// ========================================

function saveGame() {


    localStorage.setItem(
        "money",
        money
    );


    localStorage.setItem(
        "stage",
        stage
    );


    localStorage.setItem(
        "autoLevel",
        autoLevel
    );


    localStorage.setItem(
        "multiplierLevel",
        multiplierLevel
    );

}



// ========================================
// 색상 밝게
// ========================================

function lighten(hex) {

    return hex + "cc";

}



// ========================================
// 초기화
// ========================================

function resetGame() {


    const answer =
        confirm(
            "정말 게임을 초기화할까요?"
        );


    if (!answer)
        return;


    money = 0;

    stage = 1;

    autoLevel = 0;

    multiplierLevel = 0;


    saveGame();

    updateScreen();

}



// ========================================
// 게임 시작
// ========================================

updateScreen();

</script>

</body>
</html>
```
